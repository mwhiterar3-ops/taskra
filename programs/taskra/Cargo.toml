[package]
name = "taskra"
version = "0.1.0"
description = "Taskra task escrow and settlement program"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "taskra"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
# `token_2022` is needed only because anchor-lang 1.1.2's `init` code generation
# and anchor-spl's IDL build reference those modules. The program itself accepts
# the classic SPL Token program and its accounts exclusively.
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "=0.10.0"
solana-account = "3"
solana-keypair = "3"
solana-message = "3"
solana-sha256-hasher = "3"
solana-signer = "3"
solana-transaction = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
