# Program tests run in-process on LiteSVM via `cargo test`, so no validator is started.
skip_local_validator = true

[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
taskra = "Er3LnCob3phcQUU9Sjz4dWq5xr5GD2SmasDg31vcwFGb"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
